<html>
  <head>
    <link rel="stylesheet" href="../css/canchaDetalle.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-...."
      crossorigin="anonymous"
    />
    <link rel="icon" type="image/png" href="utils/images/logo.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <header>
      <a href="../index.html"
        ><img
          src="../utils/images/logo.png"
          alt="Canchas Del Sur Logo"
          id="logo"
      /></a>
      <h1 id="tituloHeader"><a href="../index.html">Canchas Del Sur</a></h1>
      <nav>
        <ul>
          <li><a href="../index.html#nosotrosInfo">Sobre Nosotros</a></li>
          <li><a href="../index.html#faq">FAQ</a></li>
          <li><a href="../index.html#contacto">Contacto</a></li>
          <li><a href="canchasPartidos.html">Unirme</a></li>
          <li><a href="turnos.html">Turnos</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <article id="canchaDetalle">
        <section class="centrado" id="cancha">
          <img
            src="../utils/images/canchas/descarga (1).jfif"
            alt="Imagen Cancha"
            id="imagenCancha"
          />
          <h2>Nombre</h2>
        </section>

        <section class="centrado" id="detalle">
          <div class="cards" id="ubicacion">
            <div id="mapDetalle" style="width: 100%; height: 450px; border: 0;"></div>

            <hr />
            <p id="canchaUbicacion">
              <i
                class="fa-solid fa-location-dot"
                style="color: gray; margin-right: 0.3rem"
              ></i>
              <span> s</span>
            </p>
          </div>
          <div class="cards" id="descripcion">
            <h2>Nuestra Cancha</h2>
            <hr />
            <p></p>
          </div>
          <div class="cards" id="servicios">
            <h2>Servicios Incluidos</h2>
            <hr />
            <ul id="listadoServicios"></ul>
          </div>
          <div class="cards" id="disponibilidadDias">
            <h2>Dias</h2>
            <hr />
            <ul id="dias"></ul>
          </div>
          <div class="cards" id="disponibilidadHorarios">
            <h2>Horarios</h2>
            <ul id="horarios"></ul>
          </div>
        </section>
      </article>
    </main>
    <footer>
      <p>&copy; 2023 Canchas del Sur</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/canchaDetalle.js"></script>
    <script type="module">
      import { login, estaLogueado } from "../js/auth.js";

      if (!estaLogueado()) {
        login();
      }
    </script>
  </body>
</html>
