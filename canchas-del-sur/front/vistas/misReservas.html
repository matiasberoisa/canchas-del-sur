<html>
  <head>
    <link rel="stylesheet" href="../css/reservas.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-...."
      crossorigin="anonymous"
    />
    <link rel="icon" type="image/png" href="utils/images/logo.png" />
  </head>

  <body>
    <header>
      <a href="../index.html"
        ><img
          src="../utils/images/logo.png"
          alt="Canchas Del Sur Logo"
          class="logo"
      /></a>

      <h1 class="tituloHeader"><a href="../index.html">Canchas Del Sur</a></h1>
      <nav>
        <ul>
          <li><a href="canchasPartidos.html">Unirme</a></li>
          <li><a href="turnos.html">Turnos</a></li>
          <li><a href="misReservas.html">Mis Reservas</a></li>
        </ul>
      </nav>
    </header>
    <script type="module">
      import { initializeHeader } from "../js/header.js";
      document.addEventListener("DOMContentLoaded", () => {
        initializeHeader();
      });
    </script>
    <main>
      <article>
        <h2>Mis Reservas</h2>
        <section id="misReservas"></section>
      </article>
    </main>
    <footer>
      <p>&copy; 2025 CanchasDelSur. All rights reserved.</p>
    </footer>
    <script type="module">
      import { login, estaLogueado } from "../js/auth.js";
      import { cargarReservasUsuario } from "../js/misReservas.js";
      
      if (!estaLogueado()) {
        login();
      } else {
        const userId = localStorage.getItem("userId");
        if (userId) {
          cargarReservasUsuario(parseInt(userId));
        }
      }
    </script>
  </body>
</html>
